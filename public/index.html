<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Taller Vibacar</title>
  <meta name="theme-color" content="#f28c00">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="cabecera">
  <img src="/img/logo.png" alt="Vibacar" class="logo">
  <div class="titulo">Gestión de Taller</div>
  <nav id="nav"></nav>
  <div class="usuario"><b id="usuario-nombre"></b><span id="usuario-rol"></span></div>
  <form method="post" action="/acceso/salir"><button class="btn btn-pequeno" type="submit">Salir</button></form>
</header>

<main id="app"><div class="vacio">Cargando…</div></main>
<div id="modales"></div>
<div id="toasts"></div>

<!-- ============================================================ Vistas -->

<template id="tpl-kanban">
  <div class="barra-vista">
    <h2>Tablero</h2>
    <span class="contador" data-ref="contador"></span>
    <button class="btn btn-pequeno" data-accion="recargar">Actualizar</button>
    <button class="btn btn-primario" data-accion="nueva" data-permiso="ot.crear">+ Nueva O.T.</button>
  </div>
  <form class="filtros filtros-tablero" data-ref="filtros" autocomplete="off">
    <div class="ancho"><label>Buscar</label><input type="search" name="q" placeholder="Nº, cliente, máquina, síntoma, operario"></div>
    <div><label>Operario</label><select name="tecnico" data-ref="f-tecnico"><option value="">Todos</option></select></div>
    <div><label>Zona</label><select name="zona" data-ref="f-zona"><option value="">Todas</option></select></div>
    <div><label>Etiqueta</label><select name="etiqueta" data-ref="f-etiqueta"><option value="">Todas</option></select></div>
    <div><label>Prioridad</label><select name="prioridad"><option value="">Todas</option><option value="1">Alta</option><option value="2">Media</option><option value="3">Baja</option></select></div>
    <div><label>Verticales</label><select name="vertical" data-ref="f-vertical"><option value="">Todas</option><option value="mias">Solo las mías</option></select></div>
    <div class="al-final"><button class="btn btn-pequeno" type="button" data-accion="limpiar-filtros">Limpiar</button></div>
  </form>
  <div class="kanban" data-ref="columnas"></div>
</template>

<template id="tpl-planificador">
  <div class="barra-vista">
    <h2>Planificador</h2>
    <span class="contador" data-ref="contador"></span>
    <div class="plan-nav">
      <b class="plan-rango" data-ref="titulo-rango"></b>
      <button class="btn btn-pequeno" type="button" data-accion="anterior" aria-label="Anterior">‹</button>
      <button class="btn btn-pequeno" type="button" data-accion="hoy">Hoy</button>
      <button class="btn btn-pequeno" type="button" data-accion="siguiente" aria-label="Siguiente">›</button>
      <input type="date" data-ref="fecha" aria-label="Ir a una fecha">
    </div>
    <div class="conmutador" data-ref="modo">
      <button type="button" data-modo="dia">Día</button>
      <button type="button" data-modo="semana">Semana</button>
    </div>
    <button class="btn btn-pequeno" data-accion="recargar">Actualizar</button>
  </div>
  <div class="plan">
    <aside class="bandeja">
      <div class="bandeja-cabecera">
        <h3>Sin planificar <span data-ref="n-bandeja">0</span></h3>
        <form data-ref="filtros-bandeja" autocomplete="off">
          <input type="search" name="q" placeholder="Nº, cliente, máquina, síntoma" aria-label="Buscar en la bandeja">
          <div class="bandeja-selects">
            <select name="zona" data-ref="b-zona" aria-label="Zona"><option value="">Todas las zonas</option></select>
            <select name="agrupar" aria-label="Agrupar"><option value="">Sin agrupar</option><option value="zona">Por zona</option><option value="cliente">Por cliente</option></select>
          </div>
          <label class="check"><input type="checkbox" name="pausadas"> Incluir pausadas (preplanificar)</label>
        </form>
      </div>
      <div class="bandeja-lista" data-ref="lista-bandeja"></div>
    </aside>
    <section class="calendario" data-ref="calendario"></section>
  </div>
</template>

<template id="tpl-midia">
  <div class="barra-vista midia-barra">
    <h2>Mi día</h2>
    <span class="contador" data-ref="fecha"></span>
    <button class="btn" data-accion="recargar">Actualizar</button>
  </div>
  <a class="crono-banner oculto" data-ref="crono-banner" href="#midia"></a>
  <div class="midia-resumen" data-ref="resumen"></div>
  <div class="midia" data-ref="lista"><div class="vacio">Cargando…</div></div>
</template>

<template id="tpl-trabajo">
  <div class="ficha" data-ref="ficha">
    <div class="ficha-cabecera">
      <button class="btn ficha-volver" type="button" data-accion="volver">‹ Mi día</button>
      <div class="ficha-titulo"><b data-ref="numero"></b><span data-ref="chips"></span></div>
    </div>
    <div class="crono" data-ref="crono">
      <div class="crono-reloj"><span class="crono-fase" data-ref="fase">Cargando…</span><b class="crono-tiempo" data-ref="reloj">00:00:00</b></div>
      <div class="crono-fases" role="group" aria-label="Fase del cronómetro">
        <button type="button" class="fase fase-desplazamiento" data-fase="desplazamiento" disabled><span class="fase-icono">🚗</span><span class="fase-nombre">Desplazamiento</span><span class="fase-total" data-total="desplazamiento">0 min</span></button>
        <button type="button" class="fase fase-espera" data-fase="espera" disabled><span class="fase-icono">⏳</span><span class="fase-nombre">Espera de acceso</span><span class="fase-total" data-total="espera">0 min</span></button>
        <button type="button" class="fase fase-trabajo" data-fase="trabajo" disabled><span class="fase-icono">🔧</span><span class="fase-nombre">Trabajo</span><span class="fase-total" data-total="trabajo">0 min</span></button>
      </div>
    </div>
    <div class="crono-pista" data-ref="pista"></div>
    <div data-ref="avisos"></div>
    <section class="ficha-seccion">
      <h3>Cliente y máquina</h3>
      <div class="ficha-datos" data-ref="datos"></div>
    </section>
    <section class="ficha-seccion" data-ref="sec-aviso">
      <h3>Aviso</h3>
      <div class="ficha-aviso" data-ref="aviso"></div>
    </section>
    <section class="ficha-seccion oculto" data-ref="sec-checklist">
      <h3>Checklist <span class="chip chip-claro" data-ref="progreso"></span></h3>
      <div class="checklist" data-ref="checklist"></div>
    </section>
    <section class="ficha-seccion">
      <details>
        <summary>Tiempos fichados <span class="chip chip-claro" data-ref="n-tramos"></span></summary>
        <ul class="tramos" data-ref="tramos"></ul>
      </details>
    </section>
    <div class="ficha-acciones">
      <div class="ficha-falta oculto" data-ref="falta"></div>
      <div class="ficha-botones">
        <button type="button" class="btn accion-parar" data-accion="parar" disabled><b>Parar por hoy</b><small>Sigue en tu tablero</small></button>
        <button type="button" class="btn accion-pausar" data-accion="pausar" disabled><b>Pausar</b><small>Falta algo: sale de tu tablero</small></button>
        <button type="button" class="btn accion-terminar" data-accion="terminar" disabled><b>Terminar</b><small>Trabajo hecho</small></button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-listado">
  <div class="barra-vista">
    <h2>Órdenes de trabajo</h2>
    <span class="contador" data-ref="contador"></span>
    <button class="btn btn-primario" data-accion="nueva" data-permiso="ot.crear">+ Nueva O.T.</button>
  </div>
  <form class="filtros" data-ref="filtros">
    <div class="ancho"><label>Buscar</label><input type="search" name="q" placeholder="Nº, cliente, síntoma, bastidor, flota"></div>
    <div><label>Vertical</label><select name="fase" data-ref="fase"><option value="">Todas</option></select></div>
    <div><label>Etiqueta</label><select name="etiqueta" data-ref="etiqueta"><option value="">Todas</option></select></div>
    <div><label>Prioridad</label><select name="prioridad"><option value="">Todas</option><option value="1">Alta</option><option value="2">Media</option><option value="3">Baja</option></select></div>
    <div><label>Mostrar</label><select name="abiertas"><option value="1">Abiertas</option><option value="0">Todas</option></select></div>
    <div><button class="btn" type="submit">Filtrar</button></div>
  </form>
  <div class="tabla-envoltorio">
    <table class="tabla">
      <thead><tr><th>Nº</th><th>Cliente</th><th>Máquina</th><th>Síntoma</th><th>Estado</th><th>Prio.</th><th>Técnico</th><th>Abierta</th></tr></thead>
      <tbody data-ref="filas"></tbody>
    </table>
    <div class="paginacion" data-ref="paginacion"></div>
  </div>
</template>

<template id="tpl-clientes">
  <div class="barra-vista">
    <h2>Clientes</h2>
    <span class="contador" data-ref="contador"></span>
    <button class="btn btn-primario" data-accion="nuevo-cliente" data-permiso="clientes.gestionar">+ Nuevo cliente</button>
  </div>
  <form class="filtros" data-ref="filtros">
    <div class="ancho"><label>Buscar</label><input type="search" name="q" placeholder="Razón social, NIF/CIF, teléfono, contacto o código Karve" autocomplete="off"></div>
    <div><label>Mostrar</label><select name="todos"><option value="">Con actividad</option><option value="1">Todos (incluye antiguos)</option></select></div>
  </form>
  <div class="tabla-envoltorio">
    <table class="tabla">
      <thead><tr><th>Razón social</th><th>NIF/CIF</th><th>Teléfono</th><th>Contacto técnico</th><th>Comercial</th><th>Última factura</th></tr></thead>
      <tbody data-ref="filas"></tbody>
    </table>
    <div class="paginacion" data-ref="paginacion"></div>
  </div>
</template>

<!-- ============================================================ Modales -->

<template id="tpl-maquinas">
  <div class="barra-vista">
    <h2>Máquinas</h2>
    <span class="contador" data-ref="contador"></span>
    <button class="btn btn-primario" data-accion="nueva-maquina" data-permiso="maquinas.gestionar">+ Nueva máquina</button>
  </div>
  <form class="filtros" data-ref="filtros">
    <div class="ancho"><label>Buscar</label><input type="search" name="q" placeholder="Marca, modelo, bastidor, nº de flota, nº de contrato, cliente o código Karve" autocomplete="off"></div>
    <div><label>Mostrar</label><select name="todos"><option value="">Activas</option><option value="1">Todas</option></select></div>
  </form>
  <div class="tabla-envoltorio">
    <table class="tabla">
      <thead><tr><th>Máquina</th><th>Bastidor</th><th>Nº flota</th><th>Cliente</th><th>Estado</th><th>Horas</th></tr></thead>
      <tbody data-ref="filas"></tbody>
    </table>
    <div class="paginacion" data-ref="paginacion"></div>
  </div>
</template>
<template id="tpl-usuarios">
  <div class="barra-vista">
    <h2>Usuarios</h2>
    <span class="contador" data-ref="contador"></span>
    <button class="btn btn-primario" data-accion="nuevo-usuario" data-permiso="usuarios.gestionar">+ Nuevo usuario</button>
  </div>
  <form class="filtros" data-ref="filtros">
    <div class="ancho"><label>Buscar</label><input type="search" name="q" placeholder="Usuario, nombre, email o código Karve" autocomplete="off"></div>
    <div><label>Mostrar</label><select name="todos"><option value="">Activos</option><option value="1">Todos</option></select></div>
  </form>
  <div class="tabla-envoltorio">
    <table class="tabla">
      <thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Email</th><th>Código Karve</th><th>Estado</th></tr></thead>
      <tbody data-ref="filas"></tbody>
    </table>
  </div>
</template>
<template id="tpl-detalle">
  <div class="modal-fondo">
    <div class="modal">
      <div class="modal-cabecera">
        <h2><span data-ref="numero"></span> <span class="chip" data-ref="estado"></span> <span class="chip chip-etiqueta oculto" data-ref="etiqueta"></span> <span class="chip chip-claro" data-ref="prioridad"></span></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div data-ref="avisos"></div>

        <section>
          <div class="datos">
            <div><span>Cliente</span><b data-ref="cliente"></b></div>
            <div><span>Máquina</span><span data-ref="maquina"></span></div>
            <div><span>Técnico asignado</span><span data-ref="tecnico"></span></div>
            <div><span>Abierta</span><span data-ref="creado"></span></div>
            <div><span>Planificación</span><span data-ref="bloques"></span></div>
            <div data-ref="fila-tiempos" class="oculto"><span>Tiempos fichados</span><span data-ref="tiempos"></span></div>
            <div data-ref="fila-checklist" class="oculto"><span>Checklist</span><span data-ref="checklist"></span></div>
            <div data-ref="fila-karve" class="oculto"><span>En Karve</span><span data-ref="karve"></span></div>
          </div>
        </section>

        <section>
          <h3>Datos de la O.T.</h3>
          <form data-ref="form-datos">
            <div class="fila">
              <div><label>Tipo</label><select name="tipo"><option value="correctivo">Correctivo</option><option value="preventivo">Preventivo</option></select></div>
              <div><label>Prioridad</label><select name="prioridad"><option value="1">Alta</option><option value="2">Media</option><option value="3">Baja</option></select></div>
              <div><label>Origen</label><select name="origen"><option value="manual">Manual</option><option value="whatsapp">WhatsApp</option><option value="correo">Correo</option><option value="auto">Automático</option><option value="karve">Karve</option></select></div>
            </div>
            <label>Síntoma (lo que dice el cliente)</label>
            <textarea name="sintoma" maxlength="200" rows="2"></textarea>
            <label>Descripción del aviso</label>
            <textarea name="descripcion" class="amplio" maxlength="4000"></textarea>
            <label>Notas internas</label>
            <textarea name="notas_internas" maxlength="4000"></textarea>
            <div class="pista">Solo para el taller: no saldrán en el parte ni en el PDF.</div>
            <div class="acciones" data-ref="acciones-datos"><button class="btn btn-primario" type="submit">Guardar cambios</button></div>
          </form>
        </section>

        <section data-ref="sec-estado">
          <h3>Cambiar estado</h3>
          <div class="estado-botones" data-ref="transiciones"></div>
          <div class="pista">Antes de confirmar se piden el motivo (o el técnico) y una nota.</div>
          <form class="inline separado oculto" data-ref="form-etiqueta">
            <label class="etiqueta-inline">Etiqueta en esta vertical</label>
            <select name="etiqueta" data-ref="etiquetas"></select>
            <button class="btn btn-pequeno" type="submit">Cambiar etiqueta</button>
          </form>
        </section>

        <section data-ref="sec-asignacion">
          <h3>Asignación</h3>
          <div data-ref="propuestas"></div>
          <form data-ref="form-asignar" class="inline separado">
            <select name="tecnico_id" data-ref="tecnicos"></select>
            <input type="text" name="nota" placeholder="Nota (opcional)" maxlength="1000">
            <button class="btn" type="submit" data-accion="proponer">Proponer</button>
            <button class="btn btn-primario" type="button" data-accion="asignar-ya" data-permiso="ot.aprobar_asignacion">Asignar ahora</button>
          </form>
        </section>

        <section>
          <h3>Historial</h3>
          <ul class="historial" data-ref="historial"></ul>
        </section>
      </div>
    </div>
  </div>
</template>

<template id="tpl-nueva">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2>Nueva orden de trabajo</h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div data-ref="avisos"></div>
        <form data-ref="form">
          <label>Cliente</label>
          <input type="search" data-ref="buscar-cliente" placeholder="Escribe para filtrar…" autocomplete="off">
          <select name="cliente_id" data-ref="clientes" size="5" class="separado" required></select>
          <div class="inline separado" data-permiso="clientes.gestionar">
            <input type="text" data-ref="nuevo-cliente" placeholder="¿No está? Nombre del nuevo cliente" maxlength="200">
            <button class="btn btn-pequeno" type="button" data-accion="crear-cliente">Crear</button>
          </div>

          <label>Máquina</label>
          <select name="maquina_id" data-ref="maquinas"><option value="">Sin máquina</option></select>
          <div class="inline separado" data-permiso="maquinas.gestionar">
            <input type="text" data-ref="nueva-marca" placeholder="Marca" maxlength="100">
            <input type="text" data-ref="nuevo-modelo" placeholder="Modelo" maxlength="100">
            <input type="text" data-ref="nuevo-bastidor" placeholder="Bastidor / flota" maxlength="100">
            <button class="btn btn-pequeno" type="button" data-accion="crear-maquina">Crear</button>
          </div>

          <div class="fila">
            <div><label>Tipo</label><select name="tipo"><option value="correctivo">Correctivo</option><option value="preventivo">Preventivo</option></select></div>
            <div><label>Prioridad</label><select name="prioridad"><option value="">Según estado</option><option value="1">Alta</option><option value="2">Media</option><option value="3">Baja</option></select></div>
            <div><label>Origen</label><select name="origen"><option value="manual">Manual</option><option value="whatsapp">WhatsApp</option><option value="correo">Correo</option><option value="auto">Automático</option></select></div>
          </div>
          <label>Síntoma (lo que dice el cliente)</label>
          <textarea name="sintoma" class="amplio" maxlength="200" placeholder="Ej.: no arranca, pierde aceite…"></textarea>
          <label>Descripción del aviso</label>
          <textarea name="descripcion" maxlength="4000"></textarea>
          <label>Notas internas</label>
          <textarea name="notas_internas" maxlength="4000" rows="2"></textarea>
          <div class="acciones">
            <button class="btn btn-primario" type="submit">Abrir O.T.</button>
            <button class="btn" type="button" data-accion="cerrar">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

<template id="tpl-cliente">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2 data-ref="titulo"></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div data-ref="avisos"></div>
        <form data-ref="form">
          <label>Razón social</label>
          <input type="text" name="nombre" maxlength="200" required autocomplete="off">
          <div class="fila">
            <div><label>NIF/CIF</label><input type="text" name="cif" maxlength="20" autocomplete="off"></div>
            <div><label>Teléfono</label><input type="text" name="telefono" maxlength="50" inputmode="tel" autocomplete="off"></div>
          </div>
          <label>Dirección</label>
          <textarea name="direccion" rows="2" maxlength="300"></textarea>
          <div class="subtitulo"><span>Contacto de compras</span></div>
          <div class="fila">
            <div><label>Nombre</label><input type="text" name="compras_nombre" maxlength="120" autocomplete="off"></div>
            <div><label>Teléfono</label><input type="text" name="compras_telefono" maxlength="50" inputmode="tel" autocomplete="off"></div>
          </div>
          <div class="subtitulo"><span>Contacto técnico</span></div>
          <div class="fila">
            <div><label>Nombre</label><input type="text" name="tecnico_nombre" maxlength="120" autocomplete="off"></div>
            <div><label>Teléfono</label><input type="text" name="tecnico_telefono" maxlength="50" inputmode="tel" autocomplete="off"></div>
          </div>
          <label>Email del contacto técnico (recibe los partes)</label>
          <input type="email" name="tecnico_email" maxlength="200" autocomplete="off">
          <div class="subtitulo"><span>Facturación</span></div>
          <div class="fila">
            <div><label>Correo de envío de facturas</label><input type="email" name="email_facturas" maxlength="200" autocomplete="off"></div>
            <div><label>Última factura</label><input type="date" name="ultima_factura" autocomplete="off"></div>
          </div>
          <label class="check"><input type="checkbox" name="exige_pedido"> Exige nº de pedido antes de facturar</label>
          <label>Email general</label>
          <input type="email" name="email" maxlength="200" autocomplete="off">
          <label>Comercial responsable</label>
          <select name="comercial_id" data-ref="comerciales"><option value="">— Sin comercial —</option></select>
          <div class="datos separado" data-ref="meta"></div>
          <div class="separado" data-ref="bloque-maquinas">
            <div class="subtitulo"><span>Máquinas</span><button class="btn btn-pequeno" type="button" data-ref="nueva-maquina" data-permiso="maquinas.gestionar">+ Máquina</button></div>
            <ul class="lista-compacta" data-ref="maquinas"></ul>
          </div>
          <div class="separado oculto" data-ref="bloque-contactos">
            <div class="subtitulo"><span>Contactos (de Karve)</span></div>
            <ul class="lista-compacta" data-ref="contactos"></ul>
          </div>
          <div class="acciones">
            <button class="btn btn-primario" type="submit" data-ref="guardar">Guardar</button>
            <button class="btn" type="button" data-accion="cerrar">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

<template id="tpl-maquina">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2 data-ref="titulo"></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div data-ref="avisos"></div>
        <div class="aviso aviso-info oculto" data-ref="aviso-bloqueo">Tras el alta solo se cambian las horas y las observaciones. El resto de campos los corrige un administrativo.</div>
        <form data-ref="form">
          <label>Cliente propietario</label>
          <input type="search" data-ref="buscar-cliente" placeholder="Escribe para filtrar…" autocomplete="off">
          <select name="cliente_id" data-ref="clientes" size="4" class="separado" required></select>
          <div class="fila">
            <div><label>Marca</label><input type="text" name="marca" maxlength="100" autocomplete="off"></div>
            <div><label>Modelo</label><input type="text" name="modelo" maxlength="100" autocomplete="off"></div>
          </div>
          <div class="fila">
            <div><label>Bastidor / nº de serie</label><input type="text" name="bastidor" maxlength="100" autocomplete="off" class="mayusculas"></div>
            <div><label>Nº de flota</label><input type="text" name="num_flota" maxlength="50" autocomplete="off" placeholder="Se asigna al guardar (siguiente nº de flota)" readonly></div>
          </div>
          <div class="fila">
            <div><label>Estado</label><select name="estado" data-ref="estado"><option value="cliente_final">Cliente final</option><option value="propia">Propia</option><option value="rent_to_rent">Rent to Rent</option><option value="subalquilada">Subalquilada</option></select></div>
            <div><label>Nº de contrato</label><input type="text" name="num_contrato" maxlength="100" autocomplete="off" placeholder="Solo si no es cliente final"></div>
          </div>
          <label>Características técnicas (para el mecánico)</label>
          <textarea name="caracteristicas" rows="3" maxlength="4000" placeholder="Motor, potencia, capacidades, aceites, pares de apriete, particularidades…"></textarea>
          <label>Horas de máquina (último horómetro)</label>
          <input type="number" name="horometro_ultimo" min="0" step="0.1" inputmode="decimal" autocomplete="off">
          <label>Observaciones</label>
          <textarea name="observaciones" rows="3" maxlength="2000" placeholder="Ubicación habitual, accesorios, particularidades…"></textarea>
          <div class="datos separado" data-ref="meta"></div>
          <div class="acciones">
            <button class="btn btn-primario" type="submit" data-ref="guardar">Guardar</button>
            <button class="btn" type="button" data-accion="cerrar">Cancelar</button>
            <button class="btn oculto" type="button" data-ref="desbloquear" title="Solo administrativo: corregir un alta equivocada">Editar campos bloqueados</button>
            <button class="btn btn-peligro derecha oculto" type="button" data-ref="desactivar">Desactivar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>
<template id="tpl-usuario">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2 data-ref="titulo"></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div data-ref="avisos"></div>
        <form data-ref="form" autocomplete="off">
          <div class="fila">
            <div><label>Usuario (login)</label><input type="text" name="usuario" maxlength="40" required pattern="[A-Za-z0-9._\-]{3,40}" title="3-40 caracteres: letras, números, punto, guion o guion bajo" autocomplete="off"></div>
            <div><label>Rol</label><select name="rol" data-ref="roles" required></select></div>
          </div>
          <label>Nombre completo</label>
          <input type="text" name="nombre" maxlength="120" required autocomplete="off">
          <div class="fila">
            <div><label>Email</label><input type="email" name="email" maxlength="200" autocomplete="off"></div>
            <div><label>Código de operario en Karve</label><input type="text" name="karve_id" maxlength="40" placeholder="Opcional, recomendado" autocomplete="off"></div>
          </div>
          <label data-ref="etiqueta-clave">Contraseña</label>
          <input type="password" name="clave" minlength="6" maxlength="200" autocomplete="new-password">
          <div class="datos separado" data-ref="meta"></div>
          <div class="acciones">
            <button class="btn btn-primario" type="submit" data-ref="guardar">Guardar</button>
            <button class="btn" type="button" data-accion="cerrar">Cancelar</button>
            <button class="btn btn-peligro derecha oculto" type="button" data-ref="desactivar">Desactivar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>
<template id="tpl-karve">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2>Sincronización con Karve</h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div data-ref="avisos"></div>
        <div class="datos" data-ref="resumen"></div>
        <div class="separado" data-ref="bloque-alertas">
          <div class="subtitulo"><span>Avisos</span></div>
          <ul class="lista-compacta" data-ref="alertas"></ul>
        </div>
        <div class="acciones">
          <button class="btn btn-primario" type="button" data-accion="cerrar">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</template>
<template id="tpl-bloque">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2 data-ref="titulo"></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div class="pista" data-ref="resumen"></div>
        <div data-ref="avisos"></div>
        <form data-ref="form">
          <label>Técnico</label>
          <select name="tecnico_id" required></select>
          <div class="fila">
            <div><label>Día</label><input type="date" name="dia" required></div>
            <div><label>Hora de inicio</label><input type="time" name="hora_inicio" step="900" required></div>
            <div><label>Duración</label><select name="duracion_min"></select></div>
          </div>
          <label>Nota para el técnico (opcional)</label>
          <input type="text" name="nota" maxlength="500" autocomplete="off">
          <div class="acciones">
            <button class="btn btn-primario" type="submit" data-ref="guardar">Planificar</button>
            <button class="btn" type="button" data-accion="cerrar">Cancelar</button>
            <button class="btn" type="button" data-ref="ver-ot">Ver O.T.</button>
            <button class="btn oculto" type="button" data-ref="partir" title="Añadir otro bloque a esta O.T. (otro día u otro técnico)">+ Otro bloque</button>
            <button class="btn btn-peligro derecha oculto" type="button" data-ref="quitar">Quitar bloque</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

<template id="tpl-cambio-estado">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2 data-ref="titulo"></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div class="pista" data-ref="desde"></div>
        <div data-ref="avisos"></div>
        <div class="pregunta" data-ref="pregunta-1">
          <label data-ref="etiqueta-1"></label>
          <select data-ref="opcion"></select>
        </div>
        <div class="pregunta">
          <label data-ref="etiqueta-2"></label>
          <textarea data-ref="nota" class="amplio dictado" maxlength="1000" placeholder="Dicta o escribe."></textarea>
        </div>
        <div class="acciones">
          <button class="btn btn-primario btn-grande" type="button" data-ref="confirmar"></button>
          <button class="btn btn-grande" type="button" data-accion="cerrar">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-nota">
  <div class="modal-fondo tablet">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2 data-ref="titulo"></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo">
        <div class="pista" data-ref="pista"></div>
        <div data-ref="avisos"></div>
        <div class="pregunta">
          <label data-ref="etiqueta"></label>
          <textarea data-ref="nota" class="amplio dictado" maxlength="500" placeholder="Dicta o escribe."></textarea>
        </div>
        <div class="acciones">
          <button class="btn btn-primario btn-grande" type="button" data-ref="confirmar"></button>
          <button class="btn btn-grande" type="button" data-accion="cerrar">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-elegir">
  <div class="modal-fondo">
    <div class="modal estrecho">
      <div class="modal-cabecera">
        <h2 data-ref="titulo"></h2>
        <button class="cerrar" type="button" data-accion="cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-cuerpo"><div class="estado-botones opciones" data-ref="opciones"></div></div>
    </div>
  </div>
</template>

<script src="/app.js"></script>
</body>
</html>
